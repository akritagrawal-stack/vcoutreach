# Local SearXNG for Publikreach web-search enrichment.
# Start:  docker compose -f packaging/searxng/docker-compose.yml up -d
# Check:  curl 'http://127.0.0.1:8080/search?q=test&format=json'
services:
  searxng:
    image: searxng/searxng:latest
    container_name: publikreach-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
